services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_local_only
      POSTGRES_DB: sentinel
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentinel -d sentinel']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sentinel_pgdata:
